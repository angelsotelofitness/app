<title>ASF Training</title>
<!-- App del cliente (beta, 9 nov 2026). Solo corre en la PC de Angel: lee /api/app, que manda lo de un solo cliente. -->
<style>
@font-face { font-family: Poppins; font-weight: 400; src: url(fuentes/p400.woff2) format('woff2'); }
@font-face { font-family: Poppins; font-weight: 600; src: url(fuentes/p600.woff2) format('woff2'); }
@font-face { font-family: Poppins; font-weight: 700; src: url(fuentes/p700.woff2) format('woff2'); }
@font-face { font-family: Poppins; font-weight: 800; src: url(fuentes/p800.woff2) format('woff2'); }
:root {
  --fondo: #0B0D0A; --marco: #050605; --tarjeta: #181D16; --tarjeta2: #232A1F; --linea: #3A4433;
  --texto: #F2F5EE; --suave: #C9D1C1; --tenue: #9DA893;
  --lima: #A8FF3E; --lima-osc: #1E2E0B; --ambar: #FFC94D; --rojo: #FF6B5B; --azul: #5CC8FF; --mor: #B9A0FF; --nar: #FFA552; /* verde = calorías y hecho, azul = proteína, naranja = running, morado = menú, ámbar = atención */
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--marco); color: var(--texto); font-family: Poppins, system-ui, sans-serif; }
body { min-height: 100vh; display: flex; justify-content: center; }
.app { width: 100%; max-width: 430px; min-height: 100vh; background: var(--fondo); position: relative; padding-bottom: 92px; }
@media (min-width: 600px) {
  body { align-items: center; padding: 24px 0; }
  .app { min-height: 0; height: min(900px, calc(100vh - 48px)); border-radius: 40px; border: 10px solid #1a1d18; overflow: hidden; display: flex; flex-direction: column; padding-bottom: 0; box-shadow: 0 30px 80px rgba(0,0,0,.6); }
  .scroll { flex: 1; overflow-y: auto; padding-bottom: 92px; }
  nav { position: absolute !important; }
}
.scroll::-webkit-scrollbar { width: 0; }
header { padding: calc(22px + env(safe-area-inset-top)) 20px 6px; /* iPhone: deja libre el notch y la barra de estado */ display: flex; align-items: center; gap: 12px; }
header img { width: 42px; height: 42px; object-fit: contain; }
header .hola { font-size: 13px; color: var(--suave); }
header h1 { margin: 0; font-size: 21px; font-weight: 700; line-height: 1.15; }
.beta { margin-left: auto; font-size: 10px; font-weight: 700; letter-spacing: .08em; color: var(--lima); border: 1px solid var(--lima); border-radius: 99px; padding: 3px 8px; }
main { padding: 8px 16px 20px; }
section[data-v] { display: none; }
section[data-v].on { display: block; animation: entra .25s ease; }
@keyframes entra { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
h2 { font-size: 21px; font-weight: 700; color: var(--texto); line-height: 1.2; margin: 32px 2px 12px; }
.card { background: var(--tarjeta); border: 1px solid var(--linea); border-radius: 20px; padding: 18px; margin-bottom: 12px; }
.hero { background: linear-gradient(160deg, #1f2b12 0%, var(--tarjeta) 60%); border-color: #34481c; }
.etq { font-size: 12px; color: var(--lima); font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
.grande { font-size: 30px; font-weight: 800; line-height: 1.1; margin: 6px 0 4px; }
.sub { color: var(--suave); font-size: 15px; line-height: 1.5; }
.etq.run { color: var(--nar); } .etq.mor { color: var(--mor); } .etq.prot { color: var(--azul); }
.chico { font-size: 13px; line-height: 1.45; color: var(--tenue); }
.btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; border: 0; border-radius: 14px; padding: 15px; font: 600 15px Poppins, sans-serif; text-decoration: none; cursor: pointer; margin-top: 14px; }
.btn.lima { background: var(--lima); color: #0B0D0A; }
.btn.borde { background: transparent; color: var(--texto); border: 1px solid var(--linea); }
.estado { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; padding: 5px 10px; border-radius: 99px; margin-top: 8px; }
.estado.ok { background: var(--lima-osc); color: var(--lima); }
.estado.pend { background: #2b2410; color: var(--ambar); }
.fila { display: flex; gap: 10px; }
.fila > * { flex: 1; }
.mini { background: var(--tarjeta2); border-radius: 14px; padding: 12px; }
.mini b { display: block; font-size: 22px; font-weight: 700; }
.puntos { display: flex; gap: 6px; margin-top: 8px; }
.punto { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--linea); display: grid; place-items: center; font-size: 13px; color: #0B0D0A; font-weight: 700; }
.punto.lleno { background: var(--lima); border-color: var(--lima); }
.numero + .numero { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--linea); }
.numtop { display: flex; justify-content: space-between; align-items: baseline; font-size: 15px; font-weight: 600; color: var(--texto); }

.numero .barra i.pasa { background: var(--ambar); }
.numpie { font-size: 15px; color: var(--suave); margin-top: 8px; }
.numpie b { color: var(--texto); }
.semtop { display: flex; justify-content: space-between; align-items: center; font-size: 14px; font-weight: 600; margin-bottom: 8px; }

.semdias { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-bottom: 14px; }

.barras button span { height: 20px; line-height: 20px; }
.barras button i { display: block; width: 100%; max-width: 30px; border-radius: 6px 6px 2px 2px; background: var(--lima); }

.barras button i.pasa { background: var(--ambar); }

.barras .linea { position: absolute; left: 0; right: 0; border-top: 1px dashed var(--suave); pointer-events: none; }
.barras .linea span { position: absolute; right: 0; top: -18px; font-size: 11px; color: var(--suave); background: var(--tarjeta); padding: 0 4px; }
.card.mor { border-color: #4B4070; background: linear-gradient(160deg, #221c38 0%, var(--tarjeta) 60%); }
.card.run { border-color: #5b4020; background: linear-gradient(160deg, #2c1f10 0%, var(--tarjeta) 60%); }
.card.mor .chip.on { background: var(--mor); border-color: var(--mor); }
.campo { font-size: 15px; font-weight: 600; margin-top: 16px; }
.avisoerr { background: #3a1713; border: 1px solid var(--rojo); color: #FFB4AA; border-radius: 12px; padding: 12px; font-size: 14px; margin-top: 12px; }
.girar { width: 44px; height: 44px; margin: 18px auto; border-radius: 50%; border: 5px solid #4B4070; border-top-color: var(--mor); animation: gira 1s linear infinite; }
@keyframes gira { to { transform: rotate(360deg); } }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 6px; background: var(--tarjeta); border: 1px solid var(--linea); border-radius: 16px; padding: 5px; margin-bottom: 12px; }
.seg button { background: none; border: 0; border-radius: 12px; padding: 9px 4px; color: var(--suave); font: 500 13px Poppins, sans-serif; cursor: pointer; }
.seg button b { display: block; font-size: 17px; } .seg button.on { background: var(--mor); color: #15101F; }
.dosnum { display: grid; grid-template-columns: 1fr 1fr; text-align: center; margin-bottom: 8px; }
.dosnum b { display: block; font-size: 32px; font-weight: 800; line-height: 1.15; color: var(--lima); } .dosnum .prot b { color: var(--azul); }
.dosnum span { font-size: 14px; color: var(--suave); }
.comida .cab { display: flex; gap: 12px; align-items: center; }

.comida .cab b { display: block; font-size: 17px; line-height: 1.25; }
.tags { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.tag { font-size: 14px; font-weight: 700; border-radius: 99px; padding: 4px 12px; background: var(--lima-osc); color: var(--lima); } .tag.prot { background: #10293a; color: var(--azul); }
.ingr { list-style: none; margin: 12px 0 0; padding: 0; }
.ingr li { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-top: 1px solid var(--linea); font-size: 15px; }
.ingr li:first-child { border-top: 0; } .ingr li b { text-align: right; max-width: 55%; font-weight: 600; } .ingr small { display: block; font-size: 13px; color: var(--tenue); }
.bloque > summary { padding: 16px; font-size: 16px; font-weight: 600; align-items: center; } .bloque > summary small { display: block; font-size: 13px; font-weight: 400; color: var(--tenue); }
.bloque .cuerpo { padding: 0 16px 16px; } .bloque .cuerpo > .card { padding: 14px; background: var(--tarjeta2); }
.nota { background: #221c38; border: 1px solid #4B4070; border-radius: 12px; padding: 12px; font-size: 14px; line-height: 1.5; color: #E2D9FF; }
.reg { border-left: 5px solid var(--linea); } .reg.plan { border-left-color: var(--lima); } .reg.fuera { border-left-color: var(--ambar); }
.reg > .chips { display: grid; grid-template-columns: 1fr 1fr; } .reg > .chips .chip { padding: 11px 6px; }
.reg .cab { display: flex; align-items: center; gap: 12px; } .reg .cab b { font-size: 18px; display: block; } .reg .cab .der { margin-left: auto; text-align: right; font-size: 14px; }
.reg .der .k { color: var(--lima); font-weight: 700; font-size: 16px; display: block; } .reg .der .p { color: var(--azul); font-weight: 600; } .reg .der .x { color: var(--tenue); }
.icob.ok, .lista .icob.ok { background: var(--lima); color: #0B0D0A; font-weight: 800; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.chip { background: var(--tarjeta2); border: 1px solid var(--linea); color: var(--texto); border-radius: 12px; padding: 10px 13px; font: 500 14px Poppins, sans-serif; cursor: pointer; }
.chip.on { background: var(--lima); color: #0B0D0A; border-color: var(--lima); font-weight: 600; }
.paso { font-size: 14px; font-weight: 600; margin-top: 16px; }
.resultado { margin-top: 14px; background: var(--lima-osc); border: 1px solid #3c5a1a; border-radius: 16px; padding: 16px; display: none; }
.resultado.on { display: block; animation: entra .2s ease; }
.resultado h3 { margin: 0 0 6px; font-size: 18px; color: var(--lima); }
.resultado p, .resultado li { font-size: 14px; line-height: 1.55; margin: 4px 0; }
.resultado ul { padding-left: 18px; margin: 6px 0; }
.barra { height: 10px; background: var(--tarjeta2); border-radius: 99px; overflow: hidden; margin-top: 10px; }
.barra i { display: block; height: 100%; background: var(--lima); border-radius: 99px; }
.semanas { display: flex; align-items: flex-end; gap: 6px; height: 110px; margin-top: 14px; }
.semanas div { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 4px; }
.semanas span { display: block; width: 100%; background: var(--lima); border-radius: 6px 6px 3px 3px; min-height: 4px; }
.semanas span.medio { background: var(--ambar); } .semanas span.bajo { background: var(--rojo); } .semanas span.curso { background: transparent; border: 2px dashed var(--tenue); }
.semanas small { font-size: 10px; color: var(--tenue); }
.lista { list-style: none; margin: 0; padding: 0; }
.lista li { display: flex; justify-content: space-between; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--linea); font-size: 14px; }
.lista li:last-child { border-bottom: 0; }
.lista .ok { color: var(--lima); } .lista .no { color: var(--tenue); }
.plato { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
.plato div { background: var(--tarjeta2); border-radius: 14px; padding: 12px; font-size: 13px; line-height: 1.4; }
.plato b { display: block; font-size: 14px; margin-bottom: 2px; }
.plato .ico { font-size: 22px; display: block; margin-bottom: 4px; }
.copiar { display: flex; align-items: center; gap: 10px; background: var(--tarjeta2); border: 1px dashed var(--linea); border-radius: 14px; padding: 12px; margin-top: 10px; font-size: 14px; cursor: pointer; width: 100%; color: var(--texto); font-family: Poppins, sans-serif; text-align: left; }
.copiar em { margin-left: auto; font-style: normal; font-size: 12px; color: var(--lima); white-space: nowrap; }
.pasos { counter-reset: p; list-style: none; padding: 0; margin: 10px 0 0; }
.pasos li { counter-increment: p; position: relative; padding: 0 0 12px 38px; font-size: 14px; line-height: 1.5; }
.pasos li::before { content: counter(p); position: absolute; left: 0; top: 0; width: 26px; height: 26px; border-radius: 50%; background: var(--tarjeta2); color: var(--lima); font-weight: 700; font-size: 13px; display: grid; place-items: center; }
.buscar { width: 100%; background: var(--tarjeta); border: 1px solid var(--linea); border-radius: 14px; padding: 13px 14px; color: var(--texto); font: 400 15px Poppins, sans-serif; outline: none; }
.buscar:focus { border-color: var(--lima); }
details { background: var(--tarjeta); border: 1px solid var(--linea); border-radius: 16px; margin-bottom: 8px; overflow: hidden; }
summary { list-style: none; padding: 14px 16px; font-size: 15px; font-weight: 500; cursor: pointer; display: flex; justify-content: space-between; gap: 10px; }
summary::-webkit-details-marker { display: none; }
summary::after { content: '+'; color: var(--lima); font-weight: 700; font-size: 18px; line-height: 1; }
details[open] > summary::after { content: '–'; }
details .resp { padding: 0 16px 14px; font-size: 14px; line-height: 1.55; color: var(--suave); }
details .resp p { margin: 0 0 6px; }
.grupo { font-size: 12px; color: var(--tenue); margin: 16px 4px 8px; text-transform: uppercase; letter-spacing: .08em; }
.recurso { display: flex; align-items: center; gap: 14px; background: var(--tarjeta); border: 1px solid var(--linea); border-radius: 18px; padding: 16px; margin-bottom: 10px; text-decoration: none; color: var(--texto); }
.recurso .ic { width: 46px; height: 46px; border-radius: 14px; background: var(--lima-osc); display: grid; place-items: center; font-size: 22px; flex: none; }
.recurso b { display: block; font-size: 15px; font-weight: 600; }
.recurso span { font-size: 13px; color: var(--suave); }
.recurso::after { content: '›'; margin-left: auto; color: var(--tenue); font-size: 24px; }
nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 430px; background: rgba(11,13,10,.94); backdrop-filter: blur(12px); border-top: 1px solid var(--linea); display: flex; padding: 8px 6px calc(10px + env(safe-area-inset-bottom)); z-index: 5; }
@media (min-width: 600px) { nav { left: 0; transform: none; bottom: 0; } }
nav button { flex: 1; background: none; border: 0; color: var(--tenue); font: 500 11px Poppins, sans-serif; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0; cursor: pointer; }
nav button svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
nav button.on { color: var(--lima); }
.pie { text-align: center; font-size: 11px; color: var(--tenue); margin-top: 24px; line-height: 1.6; }
.aviso { text-align: center; padding: 60px 24px; color: var(--suave); }
svg.peso { width: 100%; height: 130px; margin-top: 10px; }
</style>
</head>
<body>
<div class="app">
  <div class="scroll">
    <header>
      <img src="logo.png" alt="ASF">
      <div><div class="hola" id="saludo">ASF Training</div><h1 id="nombre">Tu sistema</h1></div>
      <span class="beta">BETA</span>
    </header>
    <main id="main"><div class="aviso">Cargando…</div></main>
  </div>
  <nav id="nav">
    <button data-t="hoy" class="on"><svg viewBox="0 0 24 24"><path d="M6.5 6.5v11M17.5 6.5v11M3 9.5v5M21 9.5v5M6.5 12h11"/></svg>Hoy</button>
    <button data-t="dia"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h10M4 18h7M17 15v6M14 18h6"/></svg>Mi día</button>
    <button data-t="avance"><svg viewBox="0 0 24 24"><path d="M3 20h18M6 16v-4M11 16V8M16 16v-6M20 16V5"/></svg>Mi avance</button>
    <button data-t="comida"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/></svg>Nutrición</button>
    <button data-t="ayuda"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6v.6M12 17h.01"/></svg>Ayuda</button>
    <button data-t="recursos"><svg viewBox="0 0 24 24"><path d="M4 5h6l2 2h8v12H4z"/></svg>Recursos</button>
  </nav>
</div>
<script>
const GPT = 'https://chatgpt.com/g/g-699919b6676881919688a6829ba3d004-asf-nutricion-ia';
// Trainerize no tiene links que abran su app. En Android se abre la app directo (si no está, va a Google Play);
// en iPhone se abre su ficha de la App Store, que trae el botón "Abrir"; en la PC, la versión web.
const TRAINERIZE = (() => {
  const ua = navigator.userAgent;
  if (/Android/i.test(ua)) return 'intent://#Intent;action=android.intent.action.MAIN;category=android.intent.category.LAUNCHER;package=com.trainerize.Trainerize;S.browser_fallback_url=' + encodeURIComponent('https://play.google.com/store/apps/details?id=com.trainerize.Trainerize') + ';end';
  if (/iPhone|iPad|iPod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)) return 'https://apps.apple.com/mx/app/id516851502';
  return 'https://angelsotelofitness.trainerize.com';
})();
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const mas = (f, n) => { const d = new Date(f + 'T12:00'); d.setDate(d.getDate() + n); return d.toLocaleDateString('sv'); };
const lunesDe = (f) => mas(f, -((new Date(f + 'T12:00').getDay() + 6) % 7));
const DIAS = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
const MESES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
const fechaCorta = (f) => { const d = new Date(f + 'T12:00'); return `${d.getDate()} ${MESES[d.getMonth()]}`; };

// Equipo de cada plan, en palabras del cliente (servicio/problemas-y-soluciones.md, 1.2).
const EQUIPO = {
  gym: { txt: 'en el gimnasio', plan: 'Plan A · Gimnasio' },
  mancuernas: { txt: 'con tus mancuernas', plan: 'Plan B1 · Mancuernas' },
  bandas: { txt: 'con tus bandas', plan: 'Plan B2 · Bandas' },
  nada: { txt: 'sin pesas, en casa o en el hotel', plan: 'Plan C · Sin equipo' },
};
const PLAN_A_EQUIPO = { A: 'gym', B1: 'mancuernas', B2: 'bandas', C: 'nada' };

const cap = (s) => (s ? s.charAt(0).toUpperCase() + s.slice(1) : s);

// Nombre de la sesión como lo dice Angel: "B2. Superior 1" → "Superior 1".
function sesionDe(t) {
  const m = /^(\w+)\.\s*(.+)$/.exec(t || '');
  if (!m) return { nombre: t, plan: null };
  const plan = /^F\d/.test(m[1]) ? 'A' : m[1];
  return { nombre: m[2], plan };
}

const b64 = (s) => Uint8Array.from(atob(s), (ch) => ch.charCodeAt(0));
const hoyCDMX = () => new Intl.DateTimeFormat('en-CA', { timeZone: 'America/Mexico_City' }).format(new Date());

async function descifrar(codigo, clave) {
  const huella = Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(codigo)))).map((x) => x.toString(16).padStart(2, '0')).join('').slice(0, 20);
  const r = await fetch(`d/${huella}.json?v=${Date.now()}`, { cache: 'no-store' });
  if (!r.ok) throw new Error('sin-archivo');
  const p = await r.json();
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(codigo + ':' + clave.trim().toUpperCase()), 'PBKDF2', false, ['deriveKey']);
  const llave = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(p.s), iterations: p.i, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const claro = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(p.iv) }, llave, b64(p.c));
  return JSON.parse(new TextDecoder().decode(claro));
}

function planDelDia(c, f) {
  if (f < c.inicio || f >= mas(c.inicio, c.duracion)) return [];
  const v = D.extra.semana[new Date(f + 'T12:00').getDay()];

  if (usaPlan(c) || !x.hay || !trLeidoHoy()) return { ...base, lista: base.lista.map((s) => ({ ...s, hecha: s.hecha || (s.tipo === 'Cardio' ? x.caOk : x.fzOk) })) };
  const lista = [], una = (l) => l.find((s) => s[2]) || l[0];
  if (x.fz.length) lista.push({ f: D.hoy, t: una(x.fz)[1], tipo: 'Fuerza', hecha: x.fzOk, estado: x.fzOk ? 'Completada' : 'Pendiente' });
  if (x.ca.length) lista.push({ f: D.hoy, t: una(x.ca)[1], tipo: 'Cardio', plan: !/^Running/.test(una(x.ca)[1]), hecha: x.caOk, estado: x.caOk ? 'Completada' : 'Pendiente' });
  return { lista, agendadas: true };

function sesionesBase(c) {
  const hoy = D.hoy;
  const deHoy = c.sesiones.filter((s) => s.f === hoy && (/^\w+\./.test(s.t) || s.tipo === 'Cardio'));
  if (deHoy.length) return { lista: deHoy, agendadas: true };
  if (usaPlan(c)) return { lista: planDelDia(c, hoy), agendadas: true };
  // Si la app aún no trae lo de hoy, se toma lo que hizo el mismo día de la semana en las últimas 3 semanas.
  for (const n of [7, 14, 21]) {
    const f = mas(hoy, -n);
    const l = c.sesiones.filter((s) => s.f === f && (/^\w+\./.test(s.t) || /^Running/.test(s.t)));
    if (l.length) return { lista: l.map((s) => ({ ...s, hecha: false, estado: 'Pendiente', f: hoy })), agendadas: false };
  }
  return { lista: [], agendadas: false };
}

function proximaSesion(c) {
  for (let n = 1; n <= 7; n++) {
    const f = mas(D.hoy, n);
    if (usaPlan(c)) {
      const l = planDelDia(c, f);
      if (l.length) { const fz = l.find((s) => s.tipo === 'Fuerza'); return fz ? { f, s: sesionDe(fz.t) } : { f, s: { nombre: 'Cardio', plan: null }, cardio: true }; }
      continue;
    }
    for (const k of [7, 14]) {
      const l = c.sesiones.filter((s) => s.f === mas(f, -k) && /^\w+\./.test(s.t));
      if (l.length) return { f, s: sesionDe(l[0].t) };
    }
  }
  return null;
}

// ---------- RECORDATORIO EN EL CALENDARIO DEL CELULAR (23 nov 2026, ok de Angel) ----------
// Los archivos .ics los deja publicar-app.js en cal/<huella del link>-<hora>.ics: un aviso diario (pesarse y revisar su sesión)
// hasta el fin del programa y sus días de fotos. No llevan nombre ni datos del cliente, por eso pueden ir sin cifrar.
// Van como archivo real (no "data:", que iPhone y Android no abren) y en iPhone como suscripción webcal.
const HORAS_AVISO = ['0430', '0500', '0530', '0600', '0630', '0700', '0730', '0800', '0830', '0900'];
const claveHoraAviso = () => `asf-hora-${D.cliente.id}`;
let CAL_ID = null;
async function prepararCal() {
  const codigo = CODIGO;
  if (LOCAL || CAL_ID || !codigo) return;
  const h = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(codigo));
  CAL_ID = Array.from(new Uint8Array(h)).map((x) => x.toString(16).padStart(2, '0')).join('').slice(0, 20);
  pintarAvisoCel();
}
function pintarAvisoCel() {
  const el = document.getElementById('avisoCel'); if (!el) return;
  const fin = finPrograma();
  if (D.hoy >= fin || (!LOCAL && !CAL_ID)) { el.innerHTML = ''; return; }
  const hora = HORAS_AVISO.includes(lee(claveHoraAviso())) ? lee(claveHoraAviso()) : '0700';
  const abierto = !!el.querySelector('details[open]');
  const ua = navigator.userAgent, ios = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1), android = /Android/.test(ua);
  const url = new URL(`cal/${CAL_ID || 'local'}-${hora}.ics`, location.origin + location.pathname.replace(/[^/]*$/, '')).href;
  const webcal = url.replace(/^https?:/, 'webcal:');
  const hh = (h) => { const n = Number(h.slice(0, 2)); return `${n % 12 || 12}:${h.slice(2)} ${n < 12 ? 'am' : 'pm'}`; };
  const zona = Intl.DateTimeFormat().resolvedOptions().timeZone || 'America/Mexico_City';
  const desde = (D.hoy > D.cliente.inicio ? D.hoy : D.cliente.inicio).replace(/-/g, '');
  const fin15 = hora.endsWith('30') ? hora.slice(0, 2) + '45' : hora.slice(0, 2) + '15';
  const google = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent('Pésate y revisa tu sesión de hoy')}&dates=${desde}T${hora}00/${desde}T${fin15}00&ctz=${encodeURIComponent(zona)}&trp=false&details=${encodeURIComponent('Al despertar, en ayunas. Regístralo en Trainerize y revisa tu lista del día en tu app ASF.')}&recur=${encodeURIComponent(`RRULE:FREQ=DAILY;UNTIL=${mas(fin, 1).replace(/-/g, '')}T055959Z`)}`;
  const plan2 = (txt, href, nota) => `<div class="chico" style="margin-top:14px"><b style="color:var(--texto)">¿No se abrió?</b> ${nota}</div><a class="btn borde" href="${href}" target="_blank" rel="noopener">${txt}</a>`;
  const botones = ios ? `<a class="btn lima" style="margin-top:12px" href="${webcal}">Agregar a mi calendario</a>
      <div class="chico" style="margin-top:6px">Toca Suscribirse y deja "Eliminar alarmas" apagado.</div>${plan2('Abrir el archivo', url, 'Ábrelo en Safari y elige "Agregar todos".')}`
    : android ? `<a class="btn lima" style="margin-top:12px" href="${url}" target="_blank" rel="noopener">Agregar a mi calendario</a>
      <div class="chico" style="margin-top:6px">Abre el archivo que se descarga, elige Calendario y guarda todos.</div>${plan2('Google Calendar', google, 'Antes de guardar, toca "No se repite", elige "Todos los días" y ponle de fecha final el ' + esc(fechaCorta(fin)) + '.')}`
    : `<a class="btn lima" style="margin-top:12px" href="${url}">Outlook o Apple Calendar</a><a class="btn borde" href="${google}" target="_blank" rel="noopener">Google Calendar</a>`;
  el.innerHTML = `<details${abierto ? ' open' : ''}><summary><b>Que te avise tu celular</b></summary><div style="padding:0 16px 18px">
    <div class="sub">Un aviso todos los días para pesarte y revisar tu sesión, y otro en tus días de fotos. Se repite hasta que termine tu programa (${esc(fechaCorta(fin))}).</div>
    <div class="chico" style="margin-top:12px">A qué hora te levantas</div>
    <div class="chips">${HORAS_AVISO.map((h) => `<button class="chip${h === hora ? ' on' : ''}" data-hora="${h}" style="padding:8px 11px">${hh(h)}</button>`).join('')}</div>
    ${botones}
    <div class="chico" style="margin-top:10px">Si cambias la hora, borra primero el aviso anterior.</div>
  </div></details>`;
  el.querySelectorAll('[data-hora]').forEach((b) => b.addEventListener('click', () => { guarda(claveHoraAviso(), b.dataset.hora); pintarAvisoCel(); }));
  if (abierto) el.querySelector('details').open = true;
}

// ---------- MI AVANCE ----------
function vistaAvance(c) {
  const pctDia = Math.round(c.dia / c.duracion * 100);
  const corte1 = c.fases[0], corte2 = corte1 + c.fases[1];
  const fase = c.dia <= corte1 ? 'Fase 1 · Acondicionamiento' : c.dia <= corte2 ? 'Fase 2 · Fuerza' : 'Fase 3 · Volumen';
  const meta = D.extra.meta ? `<div class="card hero"><div class="etq">Tu meta</div><div class="sub" style="color:var(--texto);font-size:17px;font-weight:600;margin-top:6px">${esc(D.extra.meta)}</div></div>` : '';

  // Cumplimiento: últimos 30 días, solo semanas cerradas.
  const u = c.u30;
  const msg = u.apego == null ? 'Aún no hay semanas cerradas.' : u.apego >= 80 ? 'Vas cumpliendo tu plan. Así se construye el resultado.' : u.apego >= 60 ? 'Vas bien: te falta poco para llegar al 80%.' : 'Esta semana la prioridad es una: tus 3 sesiones de fuerza.';
  const cerradas = c.semanas.slice(-8);
  const barras = cerradas.map((q) => {
    const v = q.curso ? 100 : (q.apego || 0);
    const cls = q.curso ? 'curso' : q.apego >= 80 ? '' : q.apego >= 60 ? 'medio' : 'bajo';
    return `<div><span class="${cls}" style="height:${Math.max(v, 4)}%"></span><small>${q.curso ? 'Actual' : 'S' + q.n}</small></div>`;
  }).join('');

  // Peso: promedio de cada semana (lunes a domingo). Vale el promedio, nunca un solo día.
  const porSem = {};
  c.peso.forEach(([f, kg]) => { const l = lunesDe(f); (porSem[l] = porSem[l] || []).push(kg); });
  const semPeso = Object.entries(porSem).sort().map(([l, v]) => ({ l, kg: Math.round(v.reduce((a, b) => a + b, 0) / v.length * 10) / 10, n: v.length }));
  let peso;
  if (semPeso.length >= 2) {
    const kgs = semPeso.map((s) => s.kg), mn = Math.min(...kgs) - .5, mx = Math.max(...kgs) + .5;
    const x = (i) => 20 + i * (300 / Math.max(semPeso.length - 1, 1)), y = (kg) => 110 - (kg - mn) / (mx - mn) * 90;
    const pts = semPeso.map((s, i) => `${x(i)},${y(s.kg)}`).join(' ');
    const dif = Math.round((kgs[kgs.length - 1] - kgs[0]) * 10) / 10;
    peso = `<div class="grande">${kgs[kgs.length - 1]} kg</div><div class="sub">Promedio de esta semana · ${dif <= 0 ? '' : '+'}${dif} kg desde el inicio</div>
      <svg class="peso" viewBox="0 0 340 130"><polyline points="${pts}" fill="none" stroke="#A8FF3E" stroke-width="3" stroke-linejoin="round"/>${semPeso.map((s, i) => `<circle cx="${x(i)}" cy="${y(s.kg)}" r="4" fill="#A8FF3E"/><text x="${x(i)}" y="126" fill="#6E7768" font-size="10" text-anchor="middle">${fechaCorta(s.l)}</text>`).join('')}</svg>`;
  } else {
    const ult = c.peso.length ? c.peso[c.peso.length - 1] : null;
    peso = `<div class="grande">${ult ? ult[1] + ' kg' : '—'}</div><div class="sub">${ult ? 'Último registro: ' + fechaCorta(ult[0]) : 'Aún no hay registros.'}</div>
      <div class="sub" style="margin-top:10px">Pésate todos los días al despertar, en ayunas y en la misma báscula, y regístralo en Trainerize. Con 2 semanas de registros aparece aquí tu gráfica de promedio semanal.</div>`;
  }

  // Running: mejor 5K o lo más lejos que ha corrido.
  const m = c.total.mejor;
  const run = m ? (m.es5k
    ? `<div class="grande">${esc(m.ritmo)} <span style="font-size:15px;font-weight:500">min/km</span></div><div class="sub">Tu mejor 5K: ${m.km} km en ${Math.round(m.min)} min (${fechaCorta(m.f)})</div>`
    : `<div class="grande">${m.km} km</div><div class="sub">Tu distancia más larga, en ${Math.round(m.min)} min (${fechaCorta(m.f)})</div>
       <div class="barra"><i style="width:${Math.min(m.km / 5 * 100, 100)}%"></i></div><div class="chico" style="margin-top:6px">${m.km} de 5 km · Cada semana, un poco más de trote.</div>`)
    : '<div class="sub">Tu primer running aparecerá aquí.</div>';

  const hechas = c.sesiones.filter((s) => s.hecha && s.f <= D.hoy).slice(-6).reverse();
  // Logros: la conducta, no solo el resultado.
  const nFuerza = c.sesiones.filter((s) => s.hecha && s.tipo === 'Fuerza' && /^\w+\./.test(s.t)).length;
  const nCardio = c.sesiones.filter((s) => s.hecha && s.tipo === 'Cardio').length;
  let racha = 0;
  for (const q of c.semanas.filter((x) => !x.curso).reverse()) { if (q.fzHechas >= q.fzMeta && q.fzMeta) racha++; else break; }
  const logros = `<h2>Tus logros</h2><div class="card"><div class="fila">
      <div class="mini"><span class="chico">Sesiones de fuerza</span><b>${nFuerza}</b></div>
      <div class="mini"><span class="chico">Salidas de cardio</span><b>${nCardio}</b></div>
      <div class="mini"><span class="chico">Km corridos</span><b>${c.total.km || 0}</b></div></div>
      <div class="sub" style="margin-top:10px">${racha >= 1 ? `🔥 ${racha} ${racha === 1 ? 'semana' : 'semanas seguidas'} con tus 3 sesiones de fuerza.` : 'Esta semana, ve por tus 3 sesiones de fuerza.'}</div></div>`;
  return `<section data-v="avance">
    <div class="card"><div class="etq">Tu programa</div><div class="grande">Día ${c.dia} <span style="font-size:16px;color:var(--suave);font-weight:500">de ${c.duracion}</span></div>
      <div class="sub">${fase}</div><div class="barra"><i style="width:${pctDia}%"></i></div></div>
    ${meta}${logros}
    <h2>Cumplimiento</h2>
    <div class="card"><div class="fila">
      <div class="mini"><span class="chico">Últimos 30 días</span><b>${u.apego == null ? '—' : u.apego + '%'}</b></div>
      <div class="mini"><span class="chico">Fuerza</span><b>${u.fzHechas}/${u.fzMeta}</b></div>
      <div class="mini"><span class="chico">Cardio</span><b>${u.caHechas}/${u.caMeta}</b></div>
    </div><div class="sub" style="margin-top:10px">${msg}</div>
    <div class="semanas">${barras}</div></div>
    <h2>Peso</h2><div class="card">${peso}</div>
    <h2>Running</h2><div class="card">${run}</div>
    <div id="correrBox"></div>
    <h2>Últimas sesiones</h2>
    <div class="card"><ul class="lista">${hechas.map((s) => `<li><span>${esc(s.tipo === 'Cardio' ? s.t : sesionDe(s.t).nombre)}</span><span class="ok">${fechaCorta(s.f)} ✓</span></li>`).join('') || '<li class="no">Aún no hay sesiones.</li>'}</ul></div>
  </section>`;
}

    <ul class="lista" data-lista="${nombre}" style="margin-top:8px">${ALIMENTOS.map(([g, l]) => l.map(([k, n, p, kcal, prot]) => `<li data-g="${g}" data-q="${esc(sinAcentos(n + ' ' + p))}" style="align-items:center"><span><b>${esc(n)}</b><br><span class="chico">${esc(p)} · ${kcal} kcal · ${prot} g</span></span>
      <span style="display:flex;align-items:center;gap:8px;flex:none"><button class="chip" data-dmenos="${k}" data-c="${nombre}" style="padding:6px 12px">−</button><b data-dn="${k}" style="min-width:16px;text-align:center">${(c.items || {})[k] || 0}</b><button class="chip" data-dmas="${k}" data-c="${nombre}" style="padding:6px 12px">+</button></span></li>`).join('')).join('')}</ul>
    <details style="margin-top:10px"><summary class="sub" style="cursor:pointer">¿No está en la lista? Agrégalo con sus números</summary>
      <div class="sub" style="margin-top:6px">De la etiqueta del producto o pregúntale a la IA de Nutrición.</div>
      <input class="buscar" data-otro-n="${nombre}" placeholder="Qué fue (ej. barra de proteína)" style="margin-top:8px">

      <button class="btn borde" data-otro="${nombre}">Agregar</button></details>
    <button class="btn lima" data-listo="${nombre}">Listo</button></div>`;
}

function filtrar(nombre) {
  const box = document.querySelector(`[data-comida="${nombre}"]`); if (!box) return;

  const q = sinAcentos(inp.value.trim()), g = box.querySelector('[data-grupos] .on');
  box.querySelectorAll('[data-lista] li').forEach((li) => { li.style.display = q ? (li.dataset.q.includes(q) ? '' : 'none') : (g && li.dataset.g === g.dataset.grupo ? '' : 'none'); });
}

function pintarDia() {
  const el = document.getElementById('diaResumen'); if (!el) return;

  let kcal = 0, prot = 0;

  kcal += BEBIDAS.reduce((s, [k, , , c]) => s + (t[k] || 0) * c, 0);
  const vacia = (c) => !c || !c.estado || (c.estado === 'fuera' && !Object.keys(c.items || {}).length && !(c.otros || []).length);

      ${m ? `<div class="barra"><i class="${pasa && u === 'kcal' ? 'pasa' : ''}" style="width:${Math.min(100, pct)}%"></i></div>` : ''}
      <div class="numpie">${m ? `${diaReg ? 'Registraste' : 'Llevas'} <b>${num(v)}</b> de ${num(m)} ${u}` : 'llevas'}</div></div>`;

}

function consejoDia(meta, metaP, kcal, prot, faltan) {
  if (!meta) return kcal ? `<p>Llevas ${kcal} kcal y ${prot} g de proteína. Cuando tengas tus números base, aquí verás cuánto te queda.</p>` : '<p>Marca tu primera comida del día.</p>';
  const resta = meta - kcal, faltaP = Math.max(0, metaP - prot);
  if (!kcal) return `<h3>Día en cero</h3><p>Tienes ${meta.toLocaleString('es-MX')} kcal${metaP ? ` y ${metaP} g de proteína` : ''} para hoy. Empieza con proteína en tu primera comida.</p>`;
  if (resta < 0) return `<h3>Te pasaste ${(-resta).toLocaleString('es-MX')} kcal</h3><p>No pasa nada: un día no cambia tu avance, lo que cuenta es el promedio de la semana.</p>
    <ul><li>${faltan ? 'Lo que comas hoy, que sea proteína magra con verdura: pollo, atún, pescado o claras, sin tortilla, pan ni aceite extra.' : 'Por hoy ya cerraste. Toma agua y descansa.'}</li><li>Mañana retoma tu plan normal y haz tu sesión.</li><li>No compenses: nada de ayunos, de saltarte comidas ni de hacer cardio extra para "quemarlo".</li></ul>`;
  if (!faltan) return `<h3>Cerraste el día ${resta <= meta * 0.1 ? 'en tu número 💪' : `con ${resta.toLocaleString('es-MX')} kcal de margen`}</h3><p>${metaP && faltaP > 20 ? `Te faltaron ${faltaP} g de proteína: si aún tienes hambre, un yogur griego o un licuado de proteína es la mejor opción.` : 'Excelente trabajo hoy.'}</p>`;
  const kc = Math.round(resta / faltan);
  const MAXP = 2.5, pcIdeal = faltaP / faltan;
  let palmas = metaP ? Math.min(MAXP, Math.max(0.5, Math.round(pcIdeal / 35 * 2) / 2)) : 1;
  const cabe = Math.floor(kc / 200 * 2) / 2;
  const apretado = palmas > cabe;
  if (apretado) palmas = Math.max(0.5, cabe);
  const puños = apretado ? 0 : Math.min(2, Math.max(0, Math.round((kc - palmas * 200 - 50) / 200 * 2) / 2));
  const grasa = !apretado && kc - palmas * 200 - puños * 200 > 120;
  const sobra = kc - palmas * 200 - puños * 200 - (grasa ? 100 : 0) - 50;
  const num = (n) => (n >= 1 ? Math.floor(n) : '') + (n % 1 ? '½' : '');
  const mano = (n, u, us) => `${num(n)} ${n <= 1 ? u : us}`;
  const plato = apretado || kc < 250
    ? `${mano(palmas, 'palma', 'palmas')} de proteína magra (atún, claras, pechuga o yogur griego; un licuado de proteína también sirve) con verdura libre. Sin tortilla, pan ni aceite extra.`
    : `${mano(palmas, 'palma', 'palmas')} de proteína + verdura libre${puños ? ` + ${mano(puños, 'puño', 'puños')} de carbohidrato` : ''}${grasa ? ' + 1 pulgar de grasa' : ''}.`;
  const notas = [];
  if (metaP && pcIdeal > MAXP * 35 + 5) notas.push(`Te faltan ${faltaP} g de proteína: hoy ya no se alcanza toda sin forzarte. Llega a lo que puedas y mañana mete proteína desde el desayuno.`);
  else if (apretado) notas.push('Con las calorías que te quedan, la proteína magra es la que más te rinde.');
  if (sobra > 250) notas.push(`Aún te sobrarían ~${Math.round(sobra / 50) * 50} kcal: no tienes que comértelas. Quedarte abajo también está bien; si te da hambre, una fruta o un yogur griego.`);
  if (resta < meta * 0.15 && faltan > 1) notas.push('Te queda poco margen: reparte con proteína magra y verdura para llegar sin hambre.');
  return `<h3>${faltan === 1 ? 'Para tu última comida' : `Para cada una de tus ${faltan} comidas que faltan`}: ~${kc.toLocaleString('es-MX')} kcal${metaP ? ` y ~${Math.round(Math.min(pcIdeal, palmas * 35))} g de proteína` : ''}</h3>
    <p><b>Arma tu plato así:</b> ${plato}</p>${notas.map((n) => `<p>${n}</p>`).join('')}`;
}

function conectarDia() {
  const box = document.getElementById('diaComidas'); if (!box) return;
  box.addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    const n = b.dataset.c || b.dataset.editar || b.dataset.listo || b.dataset.otro || b.dataset.foto || b.dataset.fotoagregar || b.dataset.fotocerrar;
    if (b.dataset.foto) return pedirFoto(n);
    if (b.dataset.textoenviar) return enviarTexto(b.dataset.textoenviar);
    const d = leerDia(); const c = d.c[n] = d.c[n] || {};
    let todo = true; // volver a pintar las tarjetas
    if (b.dataset.estado) {
      const antes = c.estado;
      c.estado = c.estado === b.dataset.estado ? undefined : b.dataset.estado;
      // Lo que escribió no se pierde al cambiar entre "Del plan" y "Fuera del plan".
      if (c.estado === 'plan' && (c.otros || []).some((o) => o.t)) { c.extras = (c.extras || []).concat(c.otros.filter((o) => o.t)); c.otros = c.otros.filter((o) => !o.t); }
      if (c.estado === 'fuera' && (c.extras || []).length) { c.otros = (c.otros || []).concat(c.extras); delete c.extras; }
      if (antes !== c.estado && textos[n]) textos[n] = { v: textos[n].v };
      editando = !hayTexto() && c.estado === 'fuera' && !Object.keys(c.items || {}).length && !(c.otros || []).length ? n : (editando === n ? null : editando);
    } else if (b.dataset.editar) editando = n;
    else if (b.dataset.listo) editando = null;
    else if (b.dataset.grupo) {
      b.parentNode.querySelectorAll('.chip').forEach((x) => x.classList.toggle('on', x === b));
      const i = box.querySelector(`[data-buscar="${n}"]`); if (i) i.value = '';
      filtrar(n); return;
    } else if (b.dataset.dmas || b.dataset.dmenos) {
      const k = b.dataset.dmas || b.dataset.dmenos; c.items = c.items || {};
      c.items[k] = Math.max(0, (c.items[k] || 0) + (b.dataset.dmas ? 1 : -1));
      if (!c.items[k]) delete c.items[k];
      const v = b.parentNode.querySelector('[data-dn]'); if (v) v.textContent = c.items[k] || 0;
      todo = false;
    } else if (b.dataset.quitar) { (c.otros || []).splice(Number(b.dataset.quitar), 1); if (textos[n]) textos[n].ok = ''; }
    else if (b.dataset.quitarx) { (c.extras || []).splice(Number(b.dataset.quitarx), 1); if (textos[n]) textos[n].ok = ''; }
    else if (b.dataset.otro) {
      const q = (s) => box.querySelector(`[data-otro-${s}="${n}"]`);
      const k = Number(q('k').value), p = Number(q('p').value) || 0;
      if (!k) return;
      c.otros = c.otros || []; c.otros.push({ n: q('n').value.trim() || 'Otro alimento', kcal: Math.round(k), prot: Math.round(p) });
      ['n', 'k', 'p'].forEach((s) => { q(s).value = ''; });
    } else if (b.dataset.fotoagregar) {
      const r = fotoRes[n]; if (!r || !r.ok || r.agregado) return;
      c.estado = 'fuera'; c.otros = c.otros || []; c.otros.push({ n: r.platillo, kcal: Math.round(r.kcal), prot: Math.round(r.proteina) });
      r.agregado = true;
    } else if (b.dataset.fotocerrar) delete fotoRes[n];
    else return;
    guardarJ(claveDia(fDia()), d);
    if (todo) pintarComidas();
    else { const t = totalComida(c, n), s = box.querySelector(`[data-comida="${n}"] .der`); if (s) s.innerHTML = `<span class="k">${t.kcal.toLocaleString('es-MX')} kcal</span><span class="p">${t.prot} g prot</span>`; }
    pintarDia();
  });
  box.addEventListener('input', (e) => { const i = e.target.closest('[data-buscar]'); if (i) filtrar(i.dataset.buscar); const x = e.target.closest('[data-texto]'); if (x) (textos[x.dataset.texto] = textos[x.dataset.texto] || {}).v = x.value; });
  pintarComidas();
  pintarDia();
}

const tragos = {};

// ---------- REGISTRO EN LA NUBE, FOTO DEL PLATO Y MENÚ (15 nov 2026) ----------
// Solo en la app publicada: D.nube (la dirección de la puerta) viene dentro de los datos cifrados del cliente.
// El celular entra con token = SHA-256(código:CLAVE); la puerta solo conoce la huella de ese token (App.gs).
// Si no hay internet, todo sigue en el celular y se sube después (lista de pendientes).
let TOKEN = null, NUBE_OK = false, NUBE_PREFS = null, NUBE_MENU = null, NUBE_MENUS = [], menuDia = 0, menuEstado = null, editandoPrefs = false, timerNube = null;
const fotoRes = {};
// Foto, menú y subida aparecen solo cuando la puerta ya contestó bien (si App.gs no está publicado, la app se ve como antes).
const hayNube = () => !!(D && D.nube && TOKEN && NUBE_OK);
const claveT = (f) => `asf-t-${D.cliente.id}-${f}`;
const clavePend = () => `asf-pend-${D.cliente.id}`;
const claveMenu = () => `asf-menu-${D.cliente.id}`;

async function prepararNube() {
  if (LOCAL || !D.nube || TOKEN) return;
  const codigo = CODIGO, clave = lee('asf-clave-' + codigo);
  if (!codigo || !clave) return;
  const h = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(codigo + ':' + clave.toUpperCase()));
  TOKEN = Array.from(new Uint8Array(h)).map((x) => x.toString(16).padStart(2, '0')).join('');
  const m = leerJ(claveMenu(), {}); NUBE_PREFS = m.prefs || null; NUBE_MENU = m.menu || null; NUBE_MENUS = m.menus || (NUBE_MENU ? [NUBE_MENU] : []);
}

async function nube(accion, cuerpo) {
  // text/plain para que el navegador no pida permiso previo (CORS) a Apps Script.
  const r = await fetch(D.nube, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ accion, token: TOKEN, ...cuerpo }) });
  const j = await r.json();
  if (!j.ok) throw new Error(j.error === 'acceso inválido' ? 'Tu acceso no está activo. Avísale a Angel.' : (j.error || 'Sin conexión'));
  return j;
}

function estadoNube(ok) {
  const el = document.getElementById('nubeEstado'); if (!el) return;
  el.textContent = ok ? 'Tu registro queda guardado en tu cuenta ✓' : 'Sin conexión: se guarda en tu cuenta cuando vuelvas a tener internet.';
}

// Números de un día cualquiera (para subirlo y para el historial).
function resumenDia(f) {
  const c = leerJ(claveDia(f), {}).c || {}, t = leerJ(claveTragos(f), {});
  let kcal = 0, prot = 0, delPlan = 0, fuera = 0, tr = 0;
  comidasDia(c).forEach((n) => { const x = c[n]; if (!x || !x.estado) return; const v = totalComida(x, n); kcal += v.kcal; prot += v.prot; if (x.estado === 'plan') delPlan++; else if (x.estado === 'fuera') fuera++; });
  const marcadas = comidasPlan().filter((n) => c[n] && c[n].estado).length;
  BEBIDAS.forEach(([k, , , cal]) => { kcal += (t[k] || 0) * cal; if (k !== 'mezclador') tr += t[k] || 0; });
  return { kcal, prot, delPlan, fuera, tragos: tr, metaKcal: Number(D.extra.kcal) || 0, metaProt: Number(D.extra.proteina) || 0, marcadas, completo: marcadas === comidasPlan().length, hay: delPlan + fuera + tr + marcadas > 0 };
}

function marcarCambio(f) {
  if (!D || !D.cliente) return;
  guarda(claveT(f), String(Date.now()));
  const p = leerJ(clavePend(), []);
  if (!p.includes(f)) { p.push(f); try { localStorage.setItem(clavePend(), JSON.stringify(p)); } catch (e) {} }
  clearTimeout(timerNube); timerNube = setTimeout(subirPendientes, 1500);
}

async function subirPendientes() {
  if (!hayNube()) return;
  for (const f of leerJ(clavePend(), [])) {
    const t = lee(claveT(f));
    try {
      await nube('app_guardar', { fecha: f, dia: leerJ(claveDia(f), {}), tragos: leerJ(claveTragos(f), {}), resumen: resumenDia(f), actualizado: Number(t) || Date.now() });
      if (lee(claveT(f)) === t) { try { localStorage.setItem(clavePend(), JSON.stringify(leerJ(clavePend(), []).filter((x) => x !== f))); } catch (e) {} }
      estadoNube(true);
    } catch (e) { estadoNube(false); return; }
  }
}

// Al abrir: baja lo de la nube (si es más nuevo que lo del celular), sus gustos y su último menú, y sube lo pendiente.
async function sincronizar() {
  await prepararNube();
  if (!D.nube || !TOKEN) return;
  try {
    const pendDias = leerJ(clavePend(), []), pendCorrer = lee(claveCorrer() + '-pend'), tCorrer = leerCorrer().t || 0;
    const r = await nube('app_leer', {});
    NUBE_OK = true; TEXTO_OK = !!r.texto;
    const enNube = new Set();
    let cambioHoy = false;
    (r.dias || []).forEach((x) => {
      enNube.add(x.fecha);
      if (x.actualizado > (Number(lee(claveT(x.fecha))) || 0)) {
        try { localStorage.setItem(claveDia(x.fecha), JSON.stringify(x.dia || {})); localStorage.setItem(claveTragos(x.fecha), JSON.stringify(x.tragos || {})); } catch (e) {}
        guarda(claveT(x.fecha), String(x.actualizado));
        if (x.fecha === fDia()) cambioHoy = true;
      }
    });
    // La cuenta manda: lo que está marcado como subido en este celular pero no está en su cuenta es de otro perfil
    // (23 nov 2026: al cambiar de link en la misma pestaña se copiaba la carrera de la cuenta Prueba). Lo pendiente no se toca.
    const pendAhora = leerJ(clavePend(), []);
    for (let i = 0; i < 34; i++) {
      const f = mas(D.hoy, -i);
      if (enNube.has(f) || !lee(claveT(f)) || pendDias.includes(f) || pendAhora.includes(f)) continue;
      [claveDia(f), claveTragos(f), claveT(f)].forEach((k) => guarda(k, null));
      if (f === fDia()) cambioHoy = true;
    }
    if (!r.correr && tCorrer && tCorrer === leerCorrer().t && !pendCorrer && !lee(claveCorrer() + '-pend')) { guarda(claveCorrer(), null); pintarCorrer(); }
    // Lo que se registró antes de que existiera la nube: se sube una vez.
    for (let i = 0; i < 7; i++) { const f = mas(D.hoy, -i); if (!enNube.has(f) && !lee(claveT(f)) && resumenDia(f).hay) marcarCambio(f); }
    if (r.trainerize) { const nuevo = JSON.stringify(r.trainerize); if (nuevo !== JSON.stringify(TR)) { TR = r.trainerize; guarda(claveTR(), nuevo); refrescarHoy(); } }
    NUBE_PREFS = r.preferencias || null; tomarMenus(r);
    if (r.correr && (Number(r.correr.t) || 0) > (Number(leerCorrer().t) || 0)) {
      try { localStorage.setItem(claveCorrer(), JSON.stringify({ carrera: r.correr.carrera || null, pruebas: r.correr.pruebas || [], t: r.correr.t })); } catch (e) {}
      pintarCorrer();
    }
    if (cambioHoy) { Object.keys(tragos).forEach((k) => delete tragos[k]); Object.assign(tragos, leerJ(claveTragos(fDia()), {})); pintarAlcohol(); }
    pintarComidas(); pintarDia(); if (!(menuEstado || editandoPrefs || (document.getElementById('menuPedido') || {}).value)) pintarMenu();
    estadoNube(true);
    subirPendientes();
    subirCorrer();
  } catch (e) { if (NUBE_OK) estadoNube(false); }
}
// Versión nueva (23 nov 2026): el celular guardaba la versión vieja de la página y no se actualizaba sola. Al abrir o volver a la app se compara
// con version.json; si cambió, se baja la nueva y se recarga (una vez por versión, y nunca mientras escribe o espera un menú).
async function revisarVersion() {

// El menú tarda como 40 segundos y a veces el celular corta la espera aunque la nube sí lo termine:
// si falla la conexión, se pregunta cada 10 s si ya quedó guardado, en lugar de mostrar error.
const espera = (ms) => new Promise((ok) => setTimeout(ok, ms));
async function armarMenu(pedido = '') {
  if (menuEstado === 'armando') return;
  const antes = NUBE_MENUS[0] || null;
  menuEstado = 'armando'; pintarMenu(); verMenu();
  try { ponerMenuNuevo((await nube('app_menu', { kcal: D.extra.kcal, proteina: D.extra.proteina, comidas: (D.extra.comidas || []).length || undefined, pedido })).menu); }
  catch (e) {
    // Error que sí contestó la nube (tope del día, sin números...): se muestra. Corte de conexión: se espera.
    const corte = e instanceof TypeError || e instanceof SyntaxError || /abort|network|load failed/i.test(e.message || '');
    let listo = false;
    for (let i = 0; corte && !listo && i < 8; i++) {
      await espera(10000);
      try { const r = await nube('app_leer', {}); if (r.menu && !mismoMenu(r.menu, antes)) { ponerMenuNuevo(r.menu); listo = true; } } catch (e2) {}
    }
    if (!listo) menuEstado = 'error:' + (corte ? 'Se cortó la conexión y el menú no alcanzó a quedar. Intenta otra vez.' : e.message);
  }
  pintarMenu(); verMenu();
}
const verMenu = () => { if (tabActual === 'comida') document.getElementById('menuBox').scrollIntoView({ block: 'start' }); };

function conectarMenu() {
  const box = document.getElementById('menuBox'); if (!box) return;
  box.addEventListener('click', async (e) => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.pfc) { box.querySelectorAll('[data-pfc]').forEach((x) => x.classList.toggle('on', x === b)); return; }
    if (b.dataset.pfk) { b.classList.toggle('on'); return; }
    if (b.dataset.pfeditar) { editandoPrefs = true; menuEstado = null; pintarMenu(); return verMenu(); }
    if (b.dataset.pfcancelar) { editandoPrefs = false; pintarMenu(); return verMenu(); }
    if (b.dataset.menudia) { menuDia = Number(b.dataset.menudia); return pintarMenu(); }
    if (b.dataset.vermenu) { NUBE_MENU = NUBE_MENUS[Number(b.dataset.vermenu)]; menuDia = 0; guardarMenus(); return pintarMenu(); }
    if (b.dataset.copialista) return copiarTexto(b, textoLista(NUBE_MENU.menu));
    if (b.dataset.copiamenu) return copiarTexto(b, textoMenu(NUBE_MENU));
    if (b.dataset.descarga) return descargarMenu(NUBE_MENU);
    if (b.dataset.menunuevo) return armarMenu((box.querySelector('#menuPedido') || {}).value || '');
    if (b.dataset.pfguardar) {
      if (menuEstado === 'guardando') return;
      const preferencias = {
        gusta: box.querySelector('#pfGusta').value.trim(), noCome: box.querySelector('#pfNo').value.trim(),
        comidas: (D.extra.comidas || []).length || Number((box.querySelector('[data-pfc].on') || {}).dataset?.pfc) || 3,
        cocina: Array.from(box.querySelectorAll('[data-pfk].on')).map((x) => x.dataset.pfk).join(', ') || 'Sartén',
      };
      // Los errores se muestran sin volver a pintar, para no borrar lo que escribió.
      const aviso = (t) => { let a = box.querySelector('#pfError'); if (!a) { a = document.createElement('div'); a.id = 'pfError'; a.className = 'avisoerr'; b.before(a); } a.textContent = t; };
      if (!preferencias.gusta) return aviso('Escribe al menos qué te gusta comer.');
      menuEstado = 'guardando'; const antes = b.textContent; b.textContent = 'Guardando…';
      try {
        const r = await nube('app_preferencias', { preferencias });
        NUBE_PREFS = r.preferencias; editandoPrefs = false; menuEstado = null; guardarMenus();
        if (b.dataset.pfguardar === 'armar') return armarMenu();
        pintarMenu(); verMenu();
      } catch (err) { menuEstado = null; b.textContent = antes; aviso(err.message); }
    }
  });
  pintarMenu();
}

// ---------- CARRERA FINAL Y PRUEBA DE 5 KM (15 nov 2026, pedido de Angel) ----------
// Semana 1: prueba de 5 km = su tiempo de referencia. Si no llega a 5 km, registra lo más que corrió y su primera meta es completarlos (método CACO).
// Con su primer 5 km completo, la app calcula su meta de tiempo para el fin del programa.
// Se repite al final de cada fase (semanas 4, 8 y 12), como dice producto/rutinas/metodo-v2.md, sección 5.
// Carrera final: si no la ha registrado, el aviso sale siempre en Hoy. Si no encuentra evento en su ciudad,
// se agenda sola el domingo del fin de semana antes de que termine el programa. Botones para su calendario (Google o .ics).
// Se guarda en el celular y en la hoja "Registro de comidas ASF", pestaña Carreras (App.gs).
const claveCorrer = () => `asf-correr-${D.cliente.id}`;
const leerCorrer = () => { const x = leerJ(claveCorrer(), {}); x.pruebas = x.pruebas || []; return x; };
let correrForm = null; // 'prueba' | 'carrera' | null
const tiempoTxt = (s) => { s = Math.round(s); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(x).padStart(2, '0'); };
// Tiempo equivalente en otra distancia (fórmula de Riegel: al alargar la distancia el ritmo baja un poco).
const aDist = (q, km) => (q.km === km ? q.seg : q.seg * Math.pow(km / q.km, 1.06));
const kmTxt = (km) => `${km} km`;
const finPrograma = () => mas(D.cliente.inicio, D.cliente.duracion);
const fechaLarga = (f) => { const d = new Date(f + 'T12:00'); return `${DIAS[d.getDay()]} ${d.getDate()} ${MESES[d.getMonth()]}`; };
function fechaCarreraSugerida() {
  let f = mas(finPrograma(), -3);
  while (new Date(f + 'T12:00').getDay() !== 0) f = mas(f, -1);
  return f <= D.hoy ? mas(D.hoy, 7) : f;
}

// Meta de tiempo: mejora típica de quien empieza a correr con constancia 1-2 veces por semana,
// mayor entre más lento empieza, proporcional a las semanas que le quedan (12 semanas = mejora completa).
function metasCorrer(x) {
  const p = x.pruebas.slice().sort((a, b) => (a.fecha < b.fecha ? -1 : 1));
  const de5 = p.filter((q) => q.km >= 5);
  const primer5 = de5[0] || null;
  const dist = primer5 ? primer5.km : 5; // su meta va en la distancia de su primera prueba de 5 km o más (5, 10...)
  const mejor5 = de5.reduce((m, q) => (!m || aDist(q, dist) < aDist(m, dist) ? q : m), null);
  const maxKm = p.reduce((m, q) => Math.max(m, q.km), 0);
  let metaSeg = null, pct = null;
  if (primer5) {
    const base = primer5.seg, ritmo = aDist(primer5, 5) / 5;
    const semanas = Math.max(0, (new Date(finPrograma() + 'T12:00') - new Date(primer5.fecha + 'T12:00')) / 6048e5);
    pct = (ritmo > 480 ? 0.15 : ritmo > 390 ? 0.10 : 0.06) * Math.min(1, semanas / 12);
    metaSeg = Math.round(base * (1 - pct) / 5) * 5;
  }
  return { p, inicial: p[0] || null, primer5, mejor5, maxKm, metaSeg, pct, dist };
}

function guardarCorrer(x) {
  x.t = Date.now();
  try { localStorage.setItem(claveCorrer(), JSON.stringify(x)); } catch (e) {}
  guarda(claveCorrer() + '-pend', '1');
  correrForm = null;
  pintarCorrer();
  subirCorrer();
}
async function subirCorrer() {
  if (!hayNube() || !lee(claveCorrer() + '-pend')) return;
  const x = leerCorrer(), m = metasCorrer(x), t = x.t;
  try {
    await nube('app_correr', { correr: x, resumen: {
      inicial: m.inicial ? tiempoTxt(m.inicial.seg) + (m.inicial.km !== 5 ? ` en ${m.inicial.km} km` : '') : '',
      mejor: m.mejor5 ? tiempoTxt(aDist(m.mejor5, m.dist)) + (m.dist !== 5 ? ` en ${m.dist} km` : '') : '', meta: m.metaSeg ? tiempoTxt(m.metaSeg) + (m.dist !== 5 ? ` en ${m.dist} km` : '') : '' } });
    if (leerCorrer().t === t) guarda(claveCorrer() + '-pend', null);
  } catch (e) {}
}

function linksCalendario(k) {
  const d = k.fecha.replace(/-/g, ''), d2 = mas(k.fecha, 1).replace(/-/g, '');
  const titulo = `🏃 ${k.nombre} (${k.distancia})`;
  const det = `Mi carrera final del programa ASF Training.${k.ciudad ? ' ' + k.ciudad + '.' : ''} Llega con tu sesión de la semana cumplida y duerme bien la noche anterior.`;
  const g = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(titulo)}&dates=${d}/${d2}&details=${encodeURIComponent(det)}${k.ciudad ? '&location=' + encodeURIComponent(k.ciudad) : ''}`;
  // cal/carrera-AAAAMMDD.ics lo deja publicar-app.js para sábados y domingos (texto general, sin datos del cliente).
  const finde = [0, 6].includes(new Date(k.fecha + 'T12:00').getDay()) && k.fecha <= mas(finPrograma(), 14);
  const url = new URL(`cal/carrera-${d}.ics`, location.origin + location.pathname.replace(/[^/]*$/, '')).href;
  return { g, ics: finde ? (/iPhone|iPad|iPod|Macintosh/.test(navigator.userAgent) ? url.replace(/^https?:/, 'webcal:') : url) : null };
}

    if (!m.primer5) {
      texto = `<div class="grande">${m.maxKm} km</div><div class="sub"><b style="color:var(--texto)">Tu primera meta: correr los 5 km completos.</b> Usa el método CACO y cada semana trota un poco más. Cuando los completes, registra tu tiempo y la app te pone tu meta de tiempo.</div>
        <div class="barra"><i style="width:${Math.min(100, m.maxKm / 5 * 100)}%"></i></div><div class="chico" style="margin-top:6px">${m.maxKm} de 5 km</div>`;
    } else {
      const baja = m.primer5.seg - aDist(m.mejor5, m.dist), falta = aDist(m.mejor5, m.dist) - m.metaSeg;
      texto = `<div class="sub">${baja >= 5 ? `Ya bajaste <b style="color:var(--texto)">${tiempoTxt(baja)}</b> desde tu primera prueba de ${kmTxt(m.dist)}. ` : ''}${falta > 0 ? `Te faltan ${tiempoTxt(falta)} para tu meta: corre 1 o 2 veces por semana a ritmo cómodo y repite la prueba al cerrar cada fase.` : 'Ya llegaste a tu meta de tiempo 💪 Ahora a sostenerla y disfrutar tu carrera.'}</div>
        ${m.pct ? `<div class="chico" style="margin-top:6px">Meta calculada: ${Math.round(m.pct * 100)}% menos que tu primera prueba, lo esperado para quien corre con constancia hasta el final del programa.</div>` : ''}`;
    }
    prueba = `<div class="card"><div class="etq run">Tu running</div><div style="margin-top:8px">${texto}</div><ul class="lista" style="margin-top:8px">${filas.join('')}</ul>
      ${m.p.length > 1 ? `<details><summary class="chico" style="cursor:pointer">Todas tus pruebas (${m.p.length})</summary><ul class="lista">${m.p.slice().reverse().map((q) => `<li><span>${fechaCorta(q.fecha)}</span><span class="chico">${q.km} km · ${tiempoTxt(q.seg)}</span></li>`).join('')}</ul></details>` : ''}
      <button class="btn borde" data-cr="ir-prueba">Registrar nueva prueba</button></div>`;
  }

  // Carrera final
  let carrera;
  const sug = fechaCarreraSugerida();
  if (correrForm === 'carrera') {
    const v = k || {};
    carrera = `<div class="card" id="crCarrera"><div class="etq run">Tu carrera final</div>
      <div class="sub" style="margin-top:6px">Busca una carrera en tu ciudad cerca del ${fechaLarga(sug)}, el fin de semana antes de que termine tu programa.</div>
      <div class="chico" style="margin-top:10px">Nombre de la carrera</div><input id="crcN" value="${esc(v.propia ? '' : v.nombre || '')}" placeholder="Ej. Carrera Nocturna 5K" style="${campo}">
      <div class="chico" style="margin-top:10px">Fecha</div><input type="date" id="crcF" value="${esc(v.fecha || sug)}" min="${D.hoy}" style="${campo}">
      <div class="chico" style="margin-top:10px">Ciudad</div><input id="crcC" value="${esc(v.ciudad || '')}" placeholder="Ej. Monterrey" style="${campo}">
      <div class="chico" style="margin-top:10px">Distancia</div><div class="chips" style="margin-top:6px">${['5 km', '10 km', '21 km'].map((dd) => `<button class="chip${(v.distancia || '5 km') === dd ? ' on' : ''}" data-crdist="${dd}">${dd}</button>`).join('')}</div>
      <div class="chico" id="crcError" style="color:#ff7a7a;margin-top:8px"></div>
      <button class="btn lima" data-cr="guardar-carrera">Guardar mi carrera</button>
      <button class="btn borde" data-cr="propia">No encontré: agéndala por mi cuenta</button>
      <button class="chip" data-cr="cancelar" style="margin-top:8px">Cancelar</button></div>`;
  } else if (!k) {
    carrera = `<div class="card"><div class="etq run">Tu carrera final</div><div class="sub" style="margin-top:6px">Cierra tu programa corriendo una carrera. Busca una en tu ciudad para el ${fechaLarga(sug)} o antes. Si no hay, la agendamos por tu cuenta ese día.</div>
      <button class="btn lima" data-cr="ir-carrera">Registrar mi carrera</button><button class="chip" data-cr="propia" style="margin-top:8px">No encontré: agéndala por mi cuenta</button></div>`;
  } else {
    const dias = Math.round((new Date(k.fecha + 'T12:00') - new Date(D.hoy + 'T12:00')) / 864e5), cal = linksCalendario(k);
    carrera = `<div class="card run"><div class="etq run">Tu carrera final</div><div class="grande" style="font-size:22px">${esc(k.nombre)}</div>
      <div class="sub">${esc(cap(fechaLarga(k.fecha)))} · ${esc(k.distancia)}${k.ciudad ? ' · ' + esc(k.ciudad) : ''}</div>
      <div class="sub" style="margin-top:6px;color:var(--texto)">${dias > 0 ? `Faltan <b>${dias} días</b>` : dias === 0 ? '<b>Es hoy. A disfrutarla 💪</b>' : 'Ya pasó. Bien ahí ✅'}</div>
      ${k.propia ? '<div class="chico" style="margin-top:6px">Por tu cuenta: corre tu distancia ese día, con reloj o Strava, como si fuera carrera oficial.</div>' : ''}
      ${dias >= 0 ? `<div class="chico" style="margin-top:12px">Agéndala en tu calendario</div>
      <a class="btn borde" href="${cal.g}" target="_blank" rel="noopener">Google Calendar</a>
      ${cal.ics ? `<a class="btn borde" href="${cal.ics}">iPhone u Outlook</a>` : ''}` : ''}
      <button class="chip" data-cr="cambiar-carrera" style="margin-top:8px">Cambiar</button></div>`;
  }

  box.innerHTML = `<h2>Tu carrera y tu prueba</h2>${carrera}${prueba}<div class="card">${CACO}</div>`;
}

function conectarCorrer() {
  const manejar = (e) => {
    const b = e.target.closest('button'); if (!b) return;
    const box = document.getElementById('correrBox');
    if (b.dataset.crcomp) { b.parentNode.querySelectorAll('.chip').forEach((x) => x.classList.toggle('on', x === b)); box.querySelector('#crpKmBox').style.display = b.dataset.crcomp === 'no' ? '' : 'none'; return; }
    if (b.dataset.crdist) { b.parentNode.querySelectorAll('.chip').forEach((x) => x.classList.toggle('on', x === b)); return; }
    const a = b.dataset.cr; if (!a) return;
    const x = leerCorrer();
    if (a === 'ir-carrera' || a === 'ir-prueba' || a === 'cambiar-carrera') {
      correrForm = a === 'ir-prueba' ? 'prueba' : 'carrera';
      if (tabActual !== 'avance') activar('avance');
      pintarCorrer();
      const f = document.getElementById(correrForm === 'prueba' ? 'crPrueba' : 'crCarrera'); if (f) f.scrollIntoView({ block: 'start' });
      return;
    }
    if (a === 'cancelar') { correrForm = null; return pintarCorrer(); }
    if (a === 'propia') { x.carrera = { nombre: 'Mi carrera ASF', fecha: fechaCarreraSugerida(), distancia: '5 km', ciudad: '', propia: true }; return guardarCorrer(x); }
    if (a === 'guardar-carrera') {
      const nombre = box.querySelector('#crcN').value.trim(), fecha = box.querySelector('#crcF').value, err = box.querySelector('#crcError');
      if (!nombre) { err.textContent = 'Escribe el nombre de la carrera (o toca "No encontré").'; return; }
      if (!/^\d{4}-\d{2}-\d{2}$/.test(fecha)) { err.textContent = 'Elige la fecha de la carrera.'; return; }
      x.carrera = { nombre, fecha, ciudad: box.querySelector('#crcC').value.trim(), distancia: (box.querySelector('[data-crdist].on') || {}).dataset?.crdist || '5 km', propia: false };
      return guardarCorrer(x);
    }
    if (a === 'guardar-prueba') {
      const completo = (box.querySelector('[data-crcomp].on') || {}).dataset?.crcomp !== 'no', err = box.querySelector('#crpError');
      const km = completo ? 5 : Math.round(Number(box.querySelector('#crpKm').value) * 10) / 10;
      const seg = (Number(box.querySelector('#crpMin').value) || 0) * 60 + (Number(box.querySelector('#crpSeg').value) || 0);
      const fecha = box.querySelector('#crpF').value || D.hoy;
      if (!(km > 0 && km <= 50)) { err.textContent = 'Escribe cuántos kilómetros corriste.'; return; }
      if (seg < 60 || seg / km < 150 || seg / km > 1200) { err.textContent = 'Revisa tu tiempo: minutos y segundos.'; return; }
      x.pruebas.push({ fecha, km, seg });
      return guardarCorrer(x);
    }
  };
  ['correrAviso', 'correrBox'].forEach((id) => { const el = document.getElementById(id); if (el) el.addEventListener('click', manejar); });
  pintarCorrer();
}

// ---------- NAVEGACIÓN ----------
let tabActual = 'hoy';
function activar(t) {
  tabActual = t;
  document.querySelectorAll('section[data-v]').forEach((s) => s.classList.toggle('on', s.dataset.v === t));
  document.querySelectorAll('nav button').forEach((b) => b.classList.toggle('on', b.dataset.t === t));
  const sc = document.querySelector('.scroll'); sc.scrollTop = 0; window.scrollTo(0, 0);
}
document.getElementById('nav').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) activar(b.dataset.t); });

function conectar() {
  document.querySelectorAll('#arbol .chips').forEach((g) => g.addEventListener('click', (e) => {
    const b = e.target.closest('.chip'); if (!b) return;
    g.querySelectorAll('.chip').forEach((x) => x.classList.toggle('on', x === b));
    if (g.dataset.g === 'tiempo') {
      const eq = document.querySelector('#arbol [data-g=equipo]');
      if (!eq.querySelector('.on')) { const d = eq.querySelector(`[data-v="${document.getElementById('arbol').dataset.equipo}"]`); if (d) d.classList.add('on'); }
    }
    resolverArbol();
  }));
  document.querySelectorAll('[data-ir]').forEach((b) => b.addEventListener('click', () => activar(b.dataset.ir)));
  document.querySelectorAll('[data-copiar]').forEach((b) => b.addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(b.dataset.copiar); } catch (e) {}
    const em = b.querySelector('em'); em.textContent = 'Copiado ✓'; setTimeout(() => { em.textContent = 'Copiar'; }, 1500);
  }));
  document.getElementById('contador').addEventListener('click', (e) => {
    const b = e.target.closest('[data-mas],[data-menos]'); if (!b) return;
    const k = b.dataset.mas || b.dataset.menos;
    tragos[k] = Math.max(0, (tragos[k] || 0) + (b.dataset.mas ? 1 : -1));
    guardarJ(claveTragos(fDia()), tragos);
    pintarAlcohol();
    pintarDia();
  });
  Object.keys(tragos).forEach((k) => delete tragos[k]);
  Object.assign(tragos, leerJ(claveTragos(fDia()), {}));
  pintarAlcohol();
  conectarDia();
  conectarMenu();
  conectarLista();
  conectarCorrer();
  const bus = document.getElementById('buscar');
  bus.addEventListener('input', () => {
    const q = bus.value.trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
    document.querySelectorAll('#ayudas details').forEach((d) => { d.style.display = !q || d.dataset.q.normalize('NFD').replace(/[̀-ͯ]/g, '').includes(q) ? '' : 'none'; });
    document.querySelectorAll('#ayudas .grupo').forEach((g) => {
      let n = g.nextElementSibling, alguno = false;
      while (n && n.tagName === 'DETAILS') { if (n.style.display !== 'none') alguno = true; n = n.nextElementSibling; }
      g.style.display = alguno ? '' : 'none';
    });
  });
}
